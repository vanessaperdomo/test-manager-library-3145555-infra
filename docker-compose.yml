version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: manager-library-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-manager_library}
      POSTGRES_USER: ${POSTGRES_USER:-library_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-library_secret}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    networks:
      - manager-library-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-library_user} -d ${POSTGRES_DB:-manager_library}"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  manager-library-net:
    name: manager-library-net
    driver: bridge

volumes:
  pgdata:
    name: manager-library-pgdata
